
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test NetworkDiagnostics.sln -c Release

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" \
            --title "Network Diagnostics ${{ github.ref_name }}" \
            --generate-notes

  publish:
    needs: [test, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish NetworkDiagnostics.App/NetworkDiagnostics.App.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$VERSION" \
            -p:UseAppHost=true \
            -o publish

      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* `
            -DestinationPath "NetworkDiagnostics-${{ matrix.rid }}.zip"

      - name: Package and sign macOS app
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail

          APP="NetworkDiagnostics.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          FRAMEWORKS="$CONTENTS/Frameworks"
          RESOURCES="$CONTENTS/Resources"
          VERSION="${GITHUB_REF_NAME#v}"

          rm -rf "$APP"
          mkdir -p "$MACOS" "$FRAMEWORKS" "$RESOURCES"

          # The self-contained publish output is a single flat folder.
          # Fail if that ever changes, rather than producing a broken layout.
          if [ -n "$(find publish -mindepth 1 -type d)" ]; then
            echo "::error::Unexpected subdirectories in publish output"
            find publish -mindepth 1 -type d
            exit 1
          fi

          # Bundle layout:
          #   MacOS/       the apphost executable only (plus two symlinks)
          #   Frameworks/  every Mach-O file (runtime, Avalonia and Skia dylibs, createdump)
          #   Resources/   managed assemblies, deps.json, runtimeconfig.json, and
          #                symlinks to ../Frameworks for each native file
          #
          # codesign cannot seal non-code files inside Contents/MacOS, so the managed
          # files live in Resources. The .NET host resolves the real path of
          # NetworkDiagnostics.dll and then uses Resources as the application folder,
          # loading the runtime and native libraries from there; the symlinks in
          # Resources point it at the signed copies in Frameworks. No assembly or
          # native-library paths are rewritten.
          cp -p publish/NetworkDiagnostics "$MACOS/NetworkDiagnostics"
          chmod +x "$MACOS/NetworkDiagnostics"

          for f in publish/*; do
            name="$(basename "$f")"
            [ "$name" = "NetworkDiagnostics" ] && continue
            if file -b "$f" | grep -q 'Mach-O'; then
              cp -p "$f" "$FRAMEWORKS/$name"
              ln -s "../Frameworks/$name" "$RESOURCES/$name"
            else
              cp -p "$f" "$RESOURCES/$name"
            fi
          done

          # The apphost looks for these two files next to itself.
          ln -s ../Resources/NetworkDiagnostics.dll "$MACOS/NetworkDiagnostics.dll"
          ln -s ../Frameworks/libhostfxr.dylib "$MACOS/libhostfxr.dylib"

          cat > "$CONTENTS/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Network Diagnostics</string>

            <key>CFBundleDisplayName</key>
            <string>Network Diagnostics</string>

            <key>CFBundleIdentifier</key>
            <string>net.networkdiagnostics.app</string>

            <key>CFBundleExecutable</key>
            <string>NetworkDiagnostics</string>

            <key>CFBundlePackageType</key>
            <string>APPL</string>

            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>

            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>

            <key>NSHighResolutionCapable</key>
            <true/>

            <key>NSLocalNetworkUsageDescription</key>
            <string>Network Diagnostics sends ping requests to your router to measure local network latency and packet loss.</string>
          </dict>
          </plist>
          EOF

          plutil -lint "$CONTENTS/Info.plist"

          # Ad-hoc sign the nested native code first, then the bundle (which signs
          # the main executable and seals Resources). No --deep.
          # Ad-hoc signing is not a Developer ID signature or notarization:
          # Gatekeeper still blocks a downloaded copy until the user allows it.
          for f in "$FRAMEWORKS"/*; do
            codesign --force --sign - --timestamp=none "$f"
          done
          codesign --force --sign - --timestamp=none "$APP"

          codesign --verify --strict --verbose=2 "$APP"

          # Preserve the .app bundle, symlinks and permissions.
          ditto -c -k --keepParent "$APP" "NetworkDiagnostics-${{ matrix.rid }}.zip"

          # Check the archive as a user would receive it.
          mkdir -p zipcheck
          ditto -x -k "NetworkDiagnostics-${{ matrix.rid }}.zip" zipcheck
          codesign --verify --strict --verbose=2 "zipcheck/$APP"
          test -x "zipcheck/$APP/Contents/MacOS/NetworkDiagnostics"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            "NetworkDiagnostics-${{ matrix.rid }}.zip" \
            --clobber
