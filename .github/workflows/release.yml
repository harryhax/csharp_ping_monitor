name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test NetworkDiagnostics.sln -c Release

  publish:
    needs: [test, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish NetworkDiagnostics.App/NetworkDiagnostics.App.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:Version="$VERSION" -p:UseAppHost=true -o publish
      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "NetworkDiagnostics-${{ github.ref_name }}-${{ matrix.rid }}.zip"
      - name: Package macOS app
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          APP="NetworkDiagnostics.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/. "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/NetworkDiagnostics"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleName</key><string>Network Diagnostics</string>' \
            '<key>CFBundleDisplayName</key><string>Network Diagnostics</string>' \
            '<key>CFBundleIdentifier</key><string>net.networkdiagnostics.app</string>' \
            '<key>CFBundleExecutable</key><string>NetworkDiagnostics</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>CFBundleShortVersionString</key><string>'"${GITHUB_REF_NAME#v}"'</string>' \
            '<key>CFBundleVersion</key><string>${{ github.run_number }}</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '</dict></plist>' > "$APP/Contents/Info.plist"
          # Ad-hoc signature seals the local bundle; it is NOT Apple notarization.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "NetworkDiagnostics-${{ github.ref_name }}-${{ matrix.rid }}.zip"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" "NetworkDiagnostics-${{ github.ref_name }}-${{ matrix.rid }}.zip" --clobber

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Network Diagnostics ${{ github.ref_name }}" --generate-notes
