
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test NetworkDiagnostics.sln -c Release

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" \
            --title "Network Diagnostics ${{ github.ref_name }}" \
            --generate-notes

  publish:
    needs: [test, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish NetworkDiagnostics.App/NetworkDiagnostics.App.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$VERSION" \
            -p:UseAppHost=true \
            -o publish

      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* `
            -DestinationPath "NetworkDiagnostics-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - name: Package macOS app
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail

          APP="NetworkDiagnostics.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          mkdir -p "$MACOS" "$RESOURCES"

          # Copy published files into the application bundle.
          cp -R publish/. "$MACOS/"
          chmod +x "$MACOS/NetworkDiagnostics"

          # Generate Info.plist.
          cat > "$CONTENTS/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Network Diagnostics</string>

            <key>CFBundleDisplayName</key>
            <string>Network Diagnostics</string>

            <key>CFBundleIdentifier</key>
            <string>net.networkdiagnostics.app</string>

            <key>CFBundleExecutable</key>
            <string>NetworkDiagnostics</string>

            <key>CFBundlePackageType</key>
            <string>APPL</string>

            <key>CFBundleShortVersionString</key>
            <string>${GITHUB_REF_NAME#v}</string>

            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>

            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Validate bundle metadata.
          plutil -lint "$CONTENTS/Info.plist"

          # Do not ad-hoc sign the bundle yet.
          # The published .NET files are not currently arranged
          # for reliable macOS bundle sealing.
          # Proper signing and notarization will be added later.

          # Preserve the macOS application bundle structure.
          ditto -c -k --keepParent "$APP" \
            "NetworkDiagnostics-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            "NetworkDiagnostics-${{ github.ref_name }}-${{ matrix.rid }}.zip" \
            --clobber
